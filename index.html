<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>素還真 - 布袋戲打鬥</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="ui-overlay">
      <div id="score">分數: 0</div>
      <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
      <div id="hp-text">HP: 100/100</div>
    </div>
    <div id="game-over-screen" class="hidden">
      <h1>遊戲結束</h1>
      <p id="final-score"></p>
      <p>按 R 重新開始</p>
    </div>
    <div id="controls-hint">WASD 移動　J 掌擊　K 氣功</div>
  </div>

  <div id="touch-controls">
    <div id="joystick-zone">
      <canvas id="joystick-canvas" width="150" height="150"></canvas>
    </div>
    <div id="action-buttons">
      <button id="btn-palm" aria-label="掌擊">掌</button>
      <button id="btn-qi" aria-label="氣功">氣</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
